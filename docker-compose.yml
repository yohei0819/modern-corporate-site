services:
  # --- Laravel API (PHP-FPM) ---
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: recruit-app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "Recruit Portfolio"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      ADMIN_URL: http://localhost:5173
      APP_LOCALE: ja
      APP_FAKER_LOCALE: ja_JP
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: recruit_portfolio
      DB_USERNAME: recruit
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      MAIL_MAILER: log
    networks:
      - recruit-net

  # --- Nginx ---
  nginx:
    image: nginx:alpine
    container_name: recruit-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/backend
    depends_on:
      - app
    networks:
      - recruit-net

  # --- MySQL ---
  mysql:
    image: mysql:8.0
    container_name: recruit-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: recruit_portfolio
      MYSQL_USER: recruit
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruit-net

  # --- Next.js Frontend ---
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: recruit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    networks:
      - recruit-net

  # --- Vue Admin ---
  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    container_name: recruit-admin
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    networks:
      - recruit-net

volumes:
  mysql-data:

networks:
  recruit-net:
    driver: bridge
